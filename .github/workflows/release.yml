name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'opencorex-org/macsweep'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate update-signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project MacSweep.xcodeproj -scheme MacSweep -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build, ad-hoc sign, and package
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          ./scripts/release.sh

      - name: Upload draft GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          gh release create "$RELEASE_VERSION" \
            "build/Release/MacSweep-$VERSION.dmg" \
            "build/Release/MacSweep-$VERSION.zip" \
            "build/Release/appcast.xml" \
            "build/Release/SHA256SUMS.txt" \
            --verify-tag \
            --draft \
            --title "MacSweep $RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md

      - name: Publish GitHub Release
        run: gh release edit "$RELEASE_VERSION" --draft=false
